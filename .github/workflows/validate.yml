name: Validate the source code
on:
  workflow_call:
    inputs:
      terraform_directory:
        required: false
        type: string
        description: "Directory in which the Terraform configuration is available"
        default: "."
      ref:
        required: false
        type: string
        description: "Commit, tag or branch to validate. Defaults to whatever triggered the caller."
        default: ""
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub token to access the repository"

jobs:
  terraform:
    name: terraform (${{ matrix.terraform_version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - terraform_version: "1.10.5"
            primary: false
          - terraform_version: "latest"
            primary: true

    permissions:
      contents: read # for actions/checkout to fetch code
      issues: read # for publish-unit-test-result-action to read issues
      checks: write # for publish-unit-test-result-action to create checks
      pull-requests: write # for publish-unit-test-result-action to comment on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
      - name: Terraform format
        id: tf-fmt
        run: terraform -chdir=${{inputs.terraform_directory}} fmt -check
        continue-on-error: true
      - name: Terraform init
        id: tf-init
        run: terraform -chdir=${{inputs.terraform_directory}} init
      - name: Terraform validate
        id: tf-validate
        run: terraform -chdir=${{inputs.terraform_directory}} validate -no-color
      - name: Terraform test
        id: tf-test
        # -junit-xml left alpha in 1.11; older versions reject it, so they run
        # the suite plain and publish nothing.
        run: |
          args=()
          if [ "$(printf '1.11.0\n%s\n' "$(terraform version -json | jq -r .terraform_version)" | sort -V | head -1)" = "1.11.0" ]; then
            args=(-junit-xml=test-results.xml)
            echo "junit=true" >> "$GITHUB_OUTPUT"
          fi
          terraform -chdir=${{inputs.terraform_directory}} test "${args[@]}"
        continue-on-error: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.tf-test.outputs.junit == 'true'
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          files: |
            ${{inputs.terraform_directory}}/test-results.xml
          check_name: Terraform Test Results (${{ matrix.terraform_version }})
          # One comment, from the primary leg of a PR run. Release and main runs
          # have no PR of their own and would comment on whatever merged last.
          comment_mode: ${{ matrix.primary && github.event_name == 'pull_request' && 'always' || 'off' }}
          deduplicate_classes_by_file_name: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always() && steps.tf-test.outputs.junit == 'true'
        with:
          name: terraform-test-results-${{ matrix.terraform_version }}
          path: ${{inputs.terraform_directory}}/test-results.xml
          retention-days: 30

      # Findings do not depend on the Terraform version, so only one leg runs it.
      - name: Checkov validation
        id: checkov
        if: matrix.primary
        uses: bridgecrewio/checkov-action@v12
        with:
          # CLI output to the console only (no SARIF file is produced with this config)
          output_format: cli
          output_file_path: console
          config_file: .checkov-config.yml

      # The examples are the module's published usage contract, and `terraform
      # validate` does NOT evaluate preconditions — those are plan-time only. So
      # an example that cannot plan (e.g. one tripping an output precondition)
      # passes validate and every other check here. Planning each example is the
      # only step that exercises the contract as a consumer would.
      - name: Terraform plan examples
        id: tf-plan-examples
        env:
          TF_DIR: ${{ inputs.terraform_directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          examples=("${TF_DIR}"/examples/*/)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "No examples/ directories found under ${TF_DIR} — nothing to plan."
            exit 0
          fi
          for dir in "${examples[@]}"; do
            echo "::group::plan ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" plan -input=false -no-color
            echo "::endgroup::"
          done

      # fmt and test run with continue-on-error so results/artifacts still publish;
      # this gate then fails the job if either did not succeed. The examples plan
      # fails the step directly (no artifact to publish), so it is not gated here.
      - name: Fail on format or test errors
        if: steps.tf-fmt.outcome != 'success' || steps.tf-test.outcome != 'success'
        run: |
          echo "terraform fmt outcome:  ${{ steps.tf-fmt.outcome }}"
          echo "terraform test outcome: ${{ steps.tf-test.outcome }}"
          exit 1
