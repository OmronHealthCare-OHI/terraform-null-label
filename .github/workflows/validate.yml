name: Validate the source code
on:
  workflow_call:
    inputs:
      terraform_directory:
        required: false
        type: string
        description: "Directory in which the Terraform configuration is available"
        default: "."
      terraform_version:
        required: false
        type: string
        description: "Terraform version to test against. Consumers pin older versions than latest, and validation short-circuiting differs between them."
        default: "latest"
      publish_comment:
        required: false
        type: boolean
        # Named for what it gates, and no more. It used to gate Checkov too, which
        # made a matrix edit able to silently disable scanning; Checkov now runs
        # once outside the matrix. If no leg sets this, no comment is posted and
        # the check and artifacts are unaffected.
        description: "Publish the single test-results PR comment from this leg. At most one caller leg should set this."
        default: true
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub token to access the repository"

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read # for actions/checkout to fetch code
      issues: read # for publish-unit-test-result-action to read issues
      checks: write # for publish-unit-test-result-action to create checks
      pull-requests: write # for publish-unit-test-result-action to comment on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - name: Terraform format
        id: tf-fmt
        run: terraform -chdir=${{inputs.terraform_directory}} fmt -check
        continue-on-error: true
      - name: Terraform init
        id: tf-init
        run: terraform -chdir=${{inputs.terraform_directory}} init
      - name: Terraform validate
        id: tf-validate
        run: terraform -chdir=${{inputs.terraform_directory}} validate -no-color
      - name: Terraform test
        id: tf-test
        # -junit-xml left alpha in 1.11; older versions reject it, so they run
        # the suite plain and publish nothing.
        run: |
          args=()
          if [ "$(printf '1.11.0\n%s\n' "$(terraform version -json | jq -r .terraform_version)" | sort -V | head -1)" = "1.11.0" ]; then
            args=(-junit-xml=test-results.xml)
            echo "junit=true" >> "$GITHUB_OUTPUT"
          fi
          terraform -chdir=${{inputs.terraform_directory}} test "${args[@]}"
        continue-on-error: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.tf-test.outputs.junit == 'true'
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          files: |
            ${{inputs.terraform_directory}}/test-results.xml
          check_name: Terraform Test Results (${{ inputs.terraform_version }})
          # One comment, from one leg only, or every version posts its own.
          comment_mode: ${{ inputs.publish_comment && 'always' || 'off' }}
          deduplicate_classes_by_file_name: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always() && steps.tf-test.outputs.junit == 'true'
        with:
          name: terraform-test-results-${{ inputs.terraform_version }}
          path: ${{inputs.terraform_directory}}/test-results.xml
          retention-days: 30

      # fmt and test run with continue-on-error so results/artifacts still publish;
      # this gate then fails the job if either did not succeed.
      - name: Fail on format or test errors
        if: steps.tf-fmt.outcome != 'success' || steps.tf-test.outcome != 'success'
        run: |
          echo "terraform fmt outcome:  ${{ steps.tf-fmt.outcome }}"
          echo "terraform test outcome: ${{ steps.tf-test.outcome }}"
          exit 1
