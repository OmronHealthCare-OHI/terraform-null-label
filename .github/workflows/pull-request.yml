name: Pull Request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ci-${{ github.head_ref }}-pr

jobs:
  administration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR Labeling
        uses: srvaroa/labeler@v1.14.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Testing only latest hid a validation bug that broke every consumer on 1.10,
  # which is what the deployment pipeline pins.
  validate:
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.10.5", "latest"]
    uses: ./.github/workflows/validate.yml
    with:
      terraform_version: ${{ matrix.terraform_version }}
      publish_comment: ${{ matrix.terraform_version == 'latest' }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Checkov findings do not depend on the Terraform version, so this runs once,
  # outside the matrix. It used to run inside it, gated on the leg being
  # "latest" -- so pinning the matrix to explicit versions would have dropped
  # the only primary leg and stopped scanning silently, with the build green.
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkov validation
        uses: bridgecrewio/checkov-action@v12
        with:
          # CLI output to the console only (no SARIF file is produced with this config)
          output_format: cli
          output_file_path: console
          config_file: .checkov-config.yml
