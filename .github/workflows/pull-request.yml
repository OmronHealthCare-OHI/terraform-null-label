name: Pull Request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ci-${{ github.head_ref }}-pr

jobs:
  administration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR Labeling
        uses: srvaroa/labeler@v1.14.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Testing only latest hid a validation bug that broke every consumer on 1.10,
  # which is what the deployment pipeline pins.
  validate:
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.10.5", "latest"]
    uses: ./.github/workflows/validate.yml
    with:
      terraform_version: ${{ matrix.terraform_version }}
      is_primary: ${{ matrix.terraform_version == 'latest' }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
